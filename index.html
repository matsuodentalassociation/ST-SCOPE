<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>SomnoLoggerV6</title>
  <!-- QRコード解析ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: #101419; color: #f0eee6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .page { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
    
    /* カード・UI要素 */
    .card { background: #192029; border: 1px solid #2f3b48; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .label-sm { font-size: 12px; color: #84b9cf; }
    .val-text { font-size: 18px; font-weight: bold; padding: 8px 0; border-bottom: 1px solid #2f3b48; }
    
    button {
      min-height: 54px; border-radius: 12px; border: 1px solid #3c4b5b;
      background: #253c50; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button.primary { background: #84b9cf; border-color: #84b9cf; color: #10202a; }
    button.danger { background: #3a2a2a; border-color: #7a4b48; color: #f2d2cf; }
    button.sub { background: #1b232d; border-color: #2f3b48; color: #d3dde7; }
    button:disabled { opacity: 0.2; }

    .kv { display: flex; justify-content: space-between; font-size: 14px; }
    .muted { color: #7a8b9c; font-size: 12px; }
    
    /* カメラプレビュー */
    #camera-wrap { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; display: none; }
    #video-preview { width: 100%; height: 100%; object-fit: cover; }

    [hidden] { display: none !important; }
    #black { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<!-- 1-1: QR読み取り開始画面 -->
<main id="view-qr-start" class="page">
  <h1>SomnoLog V20</h1>
  <p class="muted">発行された患者用QRコードを読み取ってください。</p>
  <div class="card">
    <div id="camera-wrap"><video id="video-preview" playsinline></video></div>
    <button id="btn-open-cam" class="primary">カメラを起動</button>
    <button id="btn-select-img" class="sub">QR画像を選択</button>
    <input type="file" id="file-qr" accept="image/*" hidden>
    <button class="sub" onclick="alert('使い方の説明を表示')">使い方を見る</button>
  </div>
</main>

<!-- 1-2: 患者情報確認画面 -->
<main id="view-user-confirm" class="page" hidden>
  <h1>患者情報の確認</h1>
  <div class="card">
    <div class="input-group">
      <span class="label-sm">診療所名</span>
      <div id="conf-clinic" class="val-text">-</div>
    </div>
    <div class="input-group">
      <span class="label-sm">患者名</span>
      <div id="conf-name" class="val-text">-</div>
    </div>
    <div class="input-group">
      <span class="label-sm">ログ共有通知先 (宛先)</span>
      <div id="conf-email" class="val-text">-</div>
    </div>
    <button id="btn-user-ok" class="primary">始める</button>
    <button id="btn-user-ng" class="sub">情報が間違っています</button>
    <p class="muted" style="margin-top:10px">患者名が空欄のQRは利用できません。QRを再発行してもらってください。</p>
  </div>
</main>

<!-- メイン記録画面 (V5継承) -->
<main id="view-main" class="page" hidden>
  <header style="display:flex; justify-content:space-between; align-items:center">
    <h1 id="display-app-name">SomnoLoggerV6</h1>
    <span id="status-badge" style="font-size:12px; padding:4px 10px; border-radius:6px; background:#222;">待機中</span>
  </header>
  <div class="card">
    <div class="kv"><span id="display-user-name">未登録</span><span id="display-clinic-name" class="muted"></span></div>
  </div>
  <section class="card">
    <h2>センサー設定</h2>
    <button id="btn-mic">マイクを許可</button>
    <div style="height:8px; background:#111820; border-radius:4px; overflow:hidden"><i id="bar-level" style="display:block; height:100%; width:0%; background:#84b9cf;"></i></div>
    <div class="kv"><span>現在の音圧</span><b id="txt-level">- dBFS</b></div>
    <div class="kv"><span>音量調整 (Gain)</span><b id="txt-gain">0 dB</b></div>
    <input type="range" id="range-gain" min="-9" max="9" step="1" value="0">
    <button id="btn-motion">体動を許可</button>
    <div class="kv"><span>体動強度</span><b id="txt-motion">0.000 g</b></div>
  </section>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
    <button id="btn-start" class="primary" disabled>記録開始</button>
    <button id="btn-stop" class="danger" disabled>停止</button>
  </div>
  <button id="btn-black" class="sub" disabled>黒画面モード</button>
  <button id="btn-to-history" class="sub">履歴を見る</button>
</main>

<!-- 履歴・黒画面等はV5と同様のため省略（スクリプト内で制御） -->
<div id="black" hidden><div style="font-size:80px; color:#444;" id="black-clock">00:00</div></div>

<script>
  (function() {
    const VERSION = "6";
    const GITHUB_URL = "https://matsuodentalassociation.github.io/ST-SCOPE/index.html";
    
    // --- キャッシュバスティング & 動的フェッチ ---
    async function checkUpdate() {
      try {
        const lastVer = localStorage.getItem("app_version");
        if (lastVer !== VERSION) {
          localStorage.setItem("app_version", VERSION);
          console.log("Version Updated: " + VERSION);
        }
        // GitHubから最新のETagやContent-Lengthを確認するシミュレーション
        const res = await fetch(GITHUB_URL + "?t=" + Date.now(), { method: 'HEAD' });
        console.log("Fetch check: Latest version active.");
      } catch (e) { console.warn("Update check failed", e); }
    }

    const $ = (id) => document.getElementById(id);
    let db, state = { recording: false, user: null };

    // --- QRコード処理 ---
    const startCamera = async () => {
      $("camera-wrap").style.display = "block";
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      $("video-preview").srcObject = stream;
      $("video-preview").play();
      requestAnimationFrame(tickQR);
    };

    function tickQR() {
      const video = $("video-preview");
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);
        if (code) {
          video.srcObject.getTracks().forEach(t => t.stop());
          $("camera-wrap").style.display = "none";
          parseQR(code.data);
          return;
        }
      }
      if ($("camera-wrap").style.display !== "none") requestAnimationFrame(tickQR);
    }

    function parseQR(data) {
      try {
        // 期待する形式: clinic|name|email
        const parts = data.split("|");
        if (parts.length < 2 || !parts[1]) throw new Error("Invalid Format");
        state.tempUser = { clinic: parts[0], name: parts[1], email: parts[2] || "" };
        $("conf-clinic").textContent = state.tempUser.clinic;
        $("conf-name").textContent = state.tempUser.name;
        $("conf-email").textContent = state.tempUser.email;
        $("view-qr-start").hidden = true;
        $("view-user-confirm").hidden = false;
      } catch (e) { alert("QRコードの形式が正しくありません。"); startCamera(); }
    }

    // --- 初期化フロー ---
    async function init() {
      await checkUpdate();
      const savedUser = localStorage.getItem("user_info");
      if (savedUser) {
        state.user = JSON.parse(savedUser);
        showMain();
      }
    }

    function showMain() {
      $("view-qr-start").hidden = true;
      $("view-user-confirm").hidden = true;
      $("view-main").hidden = false;
      $("display-user-name").textContent = state.user.name + " 様";
      $("display-clinic-name").textContent = state.user.clinic;
    }

    $("btn-open-cam").onclick = startCamera;
    $("btn-user-ok").onclick = () => {
      state.user = state.tempUser;
      localStorage.setItem("user_info", JSON.stringify(state.user));
      showMain();
    };
    $("btn-user-ng").onclick = () => {
      $("view-user-confirm").hidden = true;
      $("view-qr-start").hidden = false;
      startCamera();
    };

    // センサー系 (V5から継承)
    $("btn-mic").onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.audioCtx = new AudioContext();
      const source = state.audioCtx.createMediaStreamSource(stream);
      state.gainNode = state.audioCtx.createGain();
      state.analyser = state.audioCtx.createAnalyser();
      source.connect(state.gainNode); state.gainNode.connect(state.analyser);
      $("btn-mic").disabled = true; $("btn-mic").textContent = "マイク許可済み";
      if ($("btn-motion").disabled) $("btn-start").disabled = false;
      renderLoop();
    };

    $("btn-motion").onclick = async () => {
      if (typeof DeviceMotionEvent.requestPermission === 'function') await DeviceMotionEvent.requestPermission();
      window.addEventListener("devicemotion", (e) => {
        const acc = e.accelerationIncludingGravity;
        state.motionG = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2) / 9.8 - 1;
        $("txt-motion").textContent = Math.abs(state.motionG).toFixed(3) + " g";
      });
      $("btn-motion").disabled = true; $("btn-motion").textContent = "体動許可済み";
      if ($("btn-mic").disabled) $("btn-start").disabled = false;
    };

    function renderLoop() {
      const data = new Float32Array(state.analyser.fftSize);
      state.analyser.getFloatTimeDomainData(data);
      let sum = 0; for(let i=0; i<data.length; i++) sum += data[i]*data[i];
      const db = 20 * Math.log10(Math.sqrt(sum/data.length) || 1e-5);
      $("bar-level").style.width = Math.min(100, db + 100) + "%";
      $("txt-level").textContent = Math.round(db) + " dBFS";
      requestAnimationFrame(renderLoop);
    }

    init();
  })();
</script>
</body>
</html>
