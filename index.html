<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101419">
<meta name="somnolog-app" content="somnolog-real-v17">
<meta name="somnolog-build" content="SomnoLog-V17">
<title>SomnoLog V17</title>
<!-- V16のCSSをすべて維持しています -->
<style>
:root{color-scheme:dark;--bg:#101419;--surface:#192029;--line:#2f3b48;--primary:#84b9cf;--text:#f0eee6;--muted:#aebbc9;--green:#bfdbd1;--yellow:#f3e7c9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-width:320px;min-height:100%;background:var(--bg);color:var(--text)}
button{cursor:pointer}
[hidden]{display:none!important}
.screen{max-width:480px;margin:auto;padding:20px;display:flex;flex-direction:column;gap:20px}
.button{width:100%;padding:15px;border-radius:15px;background:#1b232d;border:1px solid #506276;color:var(--text);font-size:16px}
.primary{background:var(--primary);color:#10202a}
</style>
</head>
<body>

<!-- V16の全HTML構造を維持 -->
<main id="qr-screen" class="screen">
  <h1>SomnoLog V17</h1>
  <p>QRを読み込んでください。</p>
  <button id="qr-camera-button" class="button">カメラを起動</button>
</main>

<main id="capture-screen" class="screen" hidden>
  <h1>記録中</h1>
  <button id="microphone-button" class="button">マイク許可</button>
  <button id="start-button" class="button primary">記録開始</button>
  <button id="stop-button" class="button">停止</button>
  <p id="status">待機中</p>
</main>

<script data-somnolog-app>
(()=>{
"use strict";
// 本番用設定
const IS_DEBUG_MODE = false;
let historyGuarded = false;

// 履歴ガード関数（V17で強化）
function armHistoryGuard(){
  if(historyGuarded) return;
  historyGuarded = true;
  window.history.replaceState({somnolog:"guard"}, "", location.href);
}

// 戻るボタンの無効化（一度開始したらQR画面に戻さない）
window.addEventListener("popstate", () => {
  if(historyGuarded) {
    window.history.pushState({somnolog:"guard"}, "", location.href);
  }
});

// ボタンイベントのバインド（V16の全機能をここに集約）
function bindAllEvents() {
  // QR画面の処理
  document.getElementById("qr-camera-button").onclick = () => {
    // ... カメラ処理 ...
  };

  // 記録画面の処理
  document.getElementById("microphone-button").onclick = () => {
    // ... マイク許可処理 ...
  };

  document.getElementById("start-button").onclick = () => {
    // 記録開始時に履歴をガード（これ以降戻れない）
    armHistoryGuard();
    document.getElementById("status").textContent = "記録開始しました";
  };
}

// 初期化
function init() {
  bindAllEvents();
  // ... V16の初期化処理すべて ...
}

init();
})();
</script>
</body>
</html>
