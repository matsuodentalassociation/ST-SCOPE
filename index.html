<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SomnoLog v1.0.23</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --ng:#ef4444; --border:#334155; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  .app { max-width:600px; margin:0 auto; padding:16px 16px 80px; }
  h1,h2,h3 { margin:0 0 12px; font-weight:700; }
  h1 { font-size:1.35rem; display:flex; align-items:center; justify-content:space-between; }
  .ver { font-size:.75rem; color:var(--muted); font-weight:400; }
  .page { display:none; }
  .page.active { display:block; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .between { justify-content:space-between; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 16px; border:none; border-radius:10px; font-size:.95rem; font-weight:600; cursor:pointer; background:#334155; color:var(--text); width:100%; margin-bottom:8px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background:var(--accent); color:#0f172a; }
  .btn-ok { background:var(--ok); color:#052e16; }
  .btn-ng { background:var(--ng); color:#fff; }
  .btn-warn { background:var(--warn); color:#451a03; }
  .btn-sm { padding:6px 12px; font-size:.82rem; width:auto; margin-bottom:0; }
  .muted { color:var(--muted); font-size:.85rem; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.75rem; font-weight:700; }
  .b-snore { background:rgba(34,197,94,.2); color:var(--ok); }
  .b-voice { background:rgba(239,68,68,.2); color:var(--ng); }
  .b-unknown { background:rgba(245,158,11,.2); color:var(--warn); }
  .bar-wrap { height:12px; background:#0f172a; border-radius:6px; overflow:hidden; margin:6px 0 12px; }
  .bar-fill { height:100%; width:0%; background:var(--accent); transition:width .1s linear; }
  input[type="text"], textarea { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:#0f172a; color:var(--text); font-size:.9rem; }
  input[type="range"] { width:100%; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-head { font-size:.75rem; color:var(--muted); padding:4px 0; }
  .cal-day { padding:8px 0; border-radius:8px; background:#0f172a; cursor:pointer; position:relative; font-size:.85rem; }
  .cal-day.empty { background:transparent; cursor:default; }
  .cal-day.has-rec::after { content:""; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .cal-day.selected { outline:2px solid var(--accent); }
  .ev-item { border-bottom:1px solid var(--border); padding:10px 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ev-item:last-child { border-bottom:none; }
  #black-screen { display:none; position:fixed; inset:0; background:#000; z-index:9999; color:#333; flex-direction:column; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; touch-action:none; }
  #black-screen.active { display:flex; }
  canvas { width:100%; height:220px; background:#0f172a; border-radius:8px; display:block; }
</style>
</head>
<body>
<div class="app">
  <h1>SomnoLog <span class="ver">v1.0.23</span></h1>

  <!-- 1. ホーム -->
  <section id="page-start" class="page active">
    <div class="card">
      <div class="muted">計測者ステータス</div>
      <div id="home-patient" style="font-size:1.1rem;font-weight:700;margin:4px 0 8px;">未登録</div>
      <div id="home-learning" class="muted">学習データ: 0件</div>
    </div>
    <button class="btn" onclick="App.navigate('page-user')">計測者情報の確認・登録</button>
    <button class="btn btn-primary" onclick="App.navigate('page-prep')">計測の準備へ</button>
    <button class="btn" onclick="App.navigate('page-calendar')">セッションログ（カレンダー）</button>
    <button class="btn" onclick="App.checkUpdate()">更新の確認</button>
  </section>

  <!-- 2. 計測者情報 -->
  <section id="page-user" class="page">
    <div class="card">
      <h3>計測者情報</h3>
      <div id="user-info-box" class="muted" style="margin-bottom:12px;">未登録</div>
      <button class="btn" onclick="UserMgr.scanQR()">カメラでQR読取</button>
      <input type="file" id="qr-file" accept="image/*" style="display:none" onchange="UserMgr.readQRFile(this)">
      <button class="btn" onclick="document.getElementById('qr-file').click()">画像ファイルからQR読取</button>
      <textarea id="qr-paste" rows="2" placeholder="URLまたは #slp=... コードを貼り付け"></textarea>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="UserMgr.registerFromText()">貼り付けコードで登録</button>
      <button class="btn" onclick="UserMgr.registerTest()">開発用テスト計測者登録</button>
    </div>
    <button class="btn" onclick="App.navigate('page-start')">ホームへ戻る</button>
  </section>

  <!-- 3. 計測の準備 -->
  <section id="page-prep" class="page">
    <div class="card">
      <h3>1. 権限と基準音（「あいうえお」3秒録音）</h3>
      <button class="btn" id="btn-perm-mic" onclick="PrepMgr.requestMic()">マイク許可を取得</button>
      <button class="btn" id="btn-perm-motion" onclick="PrepMgr.requestMotion()">モーション許可を取得</button>
      <button class="btn btn-primary" id="btn-ref-rec" onclick="PrepMgr.recordRef()">基準音を録音（3秒）</button>
      <button class="btn" id="btn-ref-play" onclick="PrepMgr.playRef()" disabled>基準音を再生</button>
      <div class="muted" style="margin-top:8px;">
        環境音: <span id="ref-env">--</span> dB / 基準音: <span id="ref-voice">--</span> dB / 人声認識率: <span id="ref-vad">--</span>%
      </div>
    </div>
    <div class="card">
      <h3>2. 人声判定しきい値</h3>
      <div class="row between">
        <span>しきい値: <strong id="th-val">70</strong>%</span>
        <span class="muted" id="th-learned">学習値: なし</span>
      </div>
      <input type="range" id="th-slider" min="20" max="99" value="70" oninput="PrepMgr.onThresholdChange(this.value)">
    </div>
    <button class="btn btn-ok" id="btn-start-rec" onclick="Recorder.start()" disabled>計測を開始する</button>
    <button class="btn" onclick="App.navigate('page-start')">戻る</button>
  </section>

  <!-- 4. 計測中 -->
  <section id="page-record" class="page">
    <div class="card">
      <div class="row between">
        <span id="rec-status" class="badge b-snore">計測中</span>
        <strong id="rec-time" style="font-size:1.4rem;">00:00:00</strong>
      </div>
      <div class="muted" style="margin-top:10px;">音圧 (dB): <span id="rec-db">--</span></div>
      <div class="bar-wrap"><div id="bar-db" class="bar-fill"></div></div>
      <div class="muted">体動 (G): <span id="rec-motion">--</span></div>
      <div class="bar-wrap"><div id="bar-motion" class="bar-fill" style="background:var(--ok);"></div></div>
      <div class="muted">
        イベント検出数: <strong id="rec-ev-count">0</strong> 件<br>
        モデル状態: <span id="rec-vad-state">待機中</span> / 直近人声確率: <span id="rec-last-prob">--</span>%
      </div>
    </div>
    <button class="btn" onclick="BlackScreen.enter()">黒画面モードへ</button>
    <button class="btn btn-ng" onclick="Recorder.stop()">計測を停止する</button>
    <button class="btn btn-warn" id="btn-retry-save" style="display:none;" onclick="Recorder.retrySave()">保存を再試行</button>
  </section>

  <!-- 5. カレンダー -->
  <section id="page-calendar" class="page">
    <div class="card">
      <div class="row between" style="margin-bottom:10px;">
        <button class="btn btn-sm" onclick="CalMgr.shiftMonth(-1)">◀</button>
        <strong id="cal-title"></strong>
        <button class="btn btn-sm" onclick="CalMgr.shiftMonth(1)">▶</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="card">
      <h3>選択日のセッション</h3>
      <div id="cal-list" class="muted">日付を選択してください</div>
    </div>
    <button class="btn" onclick="App.navigate('page-start')">ホームへ戻る</button>
  </section>

  <!-- 6. 音響解析詳細 -->
  <section id="page-detail" class="page">
    <div class="card">
      <div id="detail-meta" class="muted" style="margin-bottom:8px;"></div>
      <canvas id="detail-canvas" width="560" height="220"></canvas>
      <div style="margin-top:10px;">
        <input type="file" id="ext-log-file" accept=".json,.csv" style="display:none" onchange="DetailMgr.loadExternal(this)">
        <button class="btn btn-sm" onclick="document.getElementById('ext-log-file').click()">外部ログ読込 (JSON/CSV)</button>
        <button class="btn btn-sm btn-primary" onclick="ShareMgr.open(DetailMgr.currentRecordId)">データの書き出し・共有へ</button>
      </div>
    </div>
    <div class="card">
      <h3>検出イベント一覧（先頭100件）</h3>
      <div id="detail-events"></div>
    </div>
    <button class="btn" onclick="App.navigate('page-calendar')">カレンダーへ戻る</button>
  </section>

  <!-- 7. 共有・確認 -->
  <section id="page-share" class="page">
    <div class="card">
      <h3>不明音声の確認</h3>
      <div id="share-summary" class="muted" style="margin-bottom:10px;"></div>
      <div class="row">
        <button class="btn btn-ok btn-sm" onclick="ShareMgr.decideAll('snore')">まとめてOK（いびき）</button>
        <button class="btn btn-ng btn-sm" onclick="ShareMgr.decideAll('voice')">すべてダメ（除外）</button>
      </div>
    </div>
    <div class="card">
      <div id="share-list"></div>
      <div class="row between" style="margin-top:10px;">
        <button class="btn btn-sm" id="share-prev" onclick="ShareMgr.page(-1)">前へ</button>
        <span id="share-page-info" class="muted"></span>
        <button class="btn btn-sm" id="share-next" onclick="ShareMgr.page(1)">次へ</button>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-make-zip" onclick="ShareMgr.exportZip()">ZIPを作成する</button>
    <button class="btn" onclick="ShareMgr.openMailer()">メールアプリを起動する</button>
    <button class="btn" onclick="App.navigate('page-detail')">詳細へ戻る</button>
  </section>
</div>

<div id="black-screen">
  <div style="font-size:.9rem;">黒画面モード（1.5秒長押しで復帰）</div>
</div>

<script>
// キャッシュ無効化（SW解除 & Cache API削除）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}
if ('caches' in window) {
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}

// IndexedDB ラッパー
const DB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    return new Promise((res, rej) => {
      const req = indexedDB.open('SomnoLog-local', 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('clips')) d.createObjectStore('clips', { keyPath: ['recordId', 'id'] });
        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings');
      };
      req.onsuccess = () => { this.db = req.result; res(this.db); };
      req.onerror = () => rej(req.error);
    });
  },
  async get(store, key) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const req = d.transaction(store, 'readonly').objectStore(store).get(key);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  },
  async put(store, val, key) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const tx = d.transaction(store, 'readwrite');
      const s = tx.objectStore(store);
      key !== undefined ? s.put(val, key) : s.put(val);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async getAll(store) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const req = d.transaction(store, 'readonly').objectStore(store).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  },
  async getClipsByRecord(recordId) {
    const all = await this.getAll('clips');
    return all.filter(c => c.recordId === recordId);
  }
};

// アプリ全体制御
const App = {
  async init() {
    if (location.hash.includes('slp=')) {
      await UserMgr.parseAndSave(location.hash);
    }
    await this.refreshHome();
    CalMgr.init();
  },
  navigate(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'page-start') this.refreshHome();
    if (id === 'page-user') UserMgr.render();
    if (id === 'page-prep') PrepMgr.render();
    if (id === 'page-calendar') CalMgr.render();
  },
  async refreshHome() {
    const p = await DB.get('settings', 'patient');
    document.getElementById('home-patient').textContent = p ? `${p.name} (${p.id})` : '未登録';
    const learn = await DB.get('settings', 'voiceLearning');
    const cnt = learn ? (learn.snoreProbs.length + learn.voiceProbs.length) : 0;
    document.getElementById('home-learning').textContent = `学習データ: ${cnt}件`;
  },
  async checkUpdate() {
    try {
      const r = await fetch('https://api.github.com/repos/matsuodentalassociation/ST-SCOPE/commits/main');
      const j = await r.json();
      if (confirm(`最新コミット: ${j.sha.slice(0,7)}\n再読み込みして更新しますか？`)) {
        location.href = location.pathname + '?v=' + Date.now();
      }
    } catch {
      location.href = location.pathname + '?v=' + Date.now();
    }
  }
};

// 計測者管理
const UserMgr = {
  async render() {
    const p = await DB.get('settings', 'patient');
    document.getElementById('user-info-box').textContent = p
      ? `発行元: ${p.issuer || '-'} / 管理番号: ${p.id} / 氏名: ${p.name} / シリアル: ${p.serial || '-'}`
      : '未登録';
  },
  async parseAndSave(str) {
    try {
      const m = str.match(/slp=([A-Za-z0-9\-_]+)/);
      if (!m) return false;
      const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      const json = JSON.parse(decodeURIComponent(escape(atob(b64))));
      await DB.put('settings', json, 'patient');
      this.render();
      return true;
    } catch { return false; }
  },
  async registerFromText() {
    const txt = document.getElementById('qr-paste').value.trim();
    if (await this.parseAndSave(txt)) alert('登録しました');
    else alert('コードが不正です');
  },
  async registerTest() {
    await DB.put('settings', { issuer: 'DEV', id: 'TEST-001', name: 'テスト計測者', serial: '0000' }, 'patient');
    this.render();
    alert('テスト計測者を登録しました');
  },
  async scanQR() { alert('カメラQR読取はブラウザのBarcodeDetector対応環境で動作します'); },
  async readQRFile(input) {
    if (!input.files[0] || !('BarcodeDetector' in window)) return alert('未対応のブラウザです');
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const bmp = await createImageBitmap(input.files[0]);
    const res = await det.detect(bmp);
    if (res[0] && await this.parseAndSave(res[0].rawValue)) alert('QRから登録しました');
    else alert('QRを認識できませんでした');
  }
};

// 音響解析・VAD・WAVユーティリティ
const AudioUtil = {
  encodeWav(samples, sampleRate) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); ws(8, 'WAVE');
    ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, samples.length * 2, true);
    let o = 44;
    for (let i = 0; i < samples.length; i++, o += 2) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  },
  calcDb(samples) {
    let sum = 0;
    for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    const rms = Math.sqrt(sum / (samples.length || 1));
    return 20 * Math.log10(Math.max(rms, 1e-6)) + 90;
  },
  // 500〜3400Hz 帯域エネルギー比
  calcBandRatio(samples, sr) {
    const N = 512;
    if (samples.length < N) return 0;
    let total = 0, band = 0;
    for (let k = 1; k < N / 2; k++) {
      const freq = (k * sr) / N;
      let re = 0, im = 0;
      for (let n = 0; n < N; n++) {
        const ang = (2 * Math.PI * k * n) / N;
        re += samples[n] * Math.cos(ang);
        im -= samples[n] * Math.sin(ang);
      }
      const p = re * re + im * im;
      total += p;
      if (freq >= 500 && freq <= 3400) band += p;
    }
    return total > 0 ? band / total : 0;
  },
  async judgeVoice(samples, sr) {
    const bandRatio = this.calcBandRatio(samples, sr);
    let aiProb = null;
    if (window.ort && VAD.session) {
      aiProb = await VAD.infer(samples);
    }
    return aiProb !== null ? (aiProb * 0.7 + bandRatio * 0.3) : bandRatio;
  }
};

const VAD = {
  session: null,
  async init() {
    if (this.session) return true;
    try {
      if (!window.ort) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.min.js';
          s.onload = res; s.onerror = rej; document.head.appendChild(s);
        });
      }
      this.session = await ort.InferenceSession.create('https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.7/dist/silero_vad.onnx');
      return true;
    } catch { return false; }
  },
  async infer(samples) {
    if (!this.session) return null;
    try {
      const input = new ort.Tensor('float32', samples.slice(0, 512), [1, 512]);
      const sr = new ort.Tensor('int64', BigInt64Array.from([16000n]), [1]);
      const h = new ort.Tensor('float32', new Float32Array(2 * 1 * 64), [2, 1, 64]);
      const c = new ort.Tensor('float32', new Float32Array(2 * 1 * 64), [2, 1, 64]);
      const out = await this.session.run({ input, sr, h, c });
      return out.output.data[0];
    } catch { return null; }
  }
};

// 準備画面
const PrepMgr = {
  stream: null,
  async render() {
    const ref = await DB.get('settings', 'reference');
    if (ref) {
      document.getElementById('ref-env').textContent = ref.envDb.toFixed(1);
      document.getElementById('ref-voice').textContent = ref.voiceDb.toFixed(1);
      document.getElementById('ref-vad').textContent = Math.round((ref.vadProb || 0) * 100);
      document.getElementById('btn-ref-play').disabled = false;
      if (this.stream) document.getElementById('btn-start-rec').disabled = false;
    }
    const prefs = (await DB.get('settings', 'audioPrefs')) || { voiceThreshold: 70 };
    document.getElementById('th-slider').value = prefs.voiceThreshold;
    document.getElementById('th-val').textContent = prefs.voiceThreshold;
    const learn = await DB.get('settings', 'voiceLearning');
    document.getElementById('th-learned').textContent = (learn && learn.learnedThreshold)
      ? `学習値: ${Math.round(learn.learnedThreshold * 100)}%` : '学習値: なし';
  },
  async requestMic() {
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    document.getElementById('btn-perm-mic').textContent = 'マイク許可済み ✓';
    const ref = await DB.get('settings', 'reference');
    if (ref) document.getElementById('btn-start-rec').disabled = false;
  },
  async requestMotion() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      await DeviceMotionEvent.requestPermission();
    }
    document.getElementById('btn-perm-motion').textContent = 'モーション許可済み ✓';
  },
  async recordRef() {
    if (!this.stream) return alert('先にマイク許可を取得してください');
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(this.stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(proc); proc.connect(ctx.destination);
    document.getElementById('btn-ref-rec').textContent = '録音中（3秒）...';
    await new Promise(r => setTimeout(r, 3000));
    proc.disconnect(); src.disconnect();
    const len = chunks.reduce((a, b) => a + b.length, 0);
    const merged = new Float32Array(len);
    let off = 0; chunks.forEach(c => { merged.set(c, off); off += c.length; });
    const db = AudioUtil.calcDb(merged);
    const vadProb = await AudioUtil.judgeVoice(merged, ctx.sampleRate);
    const wav = AudioUtil.encodeWav(merged, ctx.sampleRate);
    await DB.put('settings', { envDb: Math.max(30, db - 15), voiceDb: db, vadProb, wav }, 'reference');
    ctx.close();
    document.getElementById('btn-ref-rec').textContent = '基準音を録音（3秒）';
    this.render();
  },
  async playRef() {
    const ref = await DB.get('settings', 'reference');
    if (ref && ref.wav) new Audio(URL.createObjectURL(ref.wav)).play();
  },
  async onThresholdChange(v) {
    document.getElementById('th-val').textContent = v;
    const prefs = (await DB.get('settings', 'audioPrefs')) || {};
    prefs.voiceThreshold = Number(v);
    await DB.put('settings', prefs, 'audioPrefs');
  }
};

// 録音エンジン
const Recorder = {
  running: false, ctx: null, proc: null, wakeLock: null, timer: null, tlTimer: null,
  recordId: null, startedAt: 0, events: [], timeline: [], preRoll: [], activeChunks: null, silenceCount: 0,
  lastMotion: 0, ref: null, th: 0.7,
  async start() {
    this.ref = await DB.get('settings', 'reference');
    const prefs = (await DB.get('settings', 'audioPrefs')) || { voiceThreshold: 70 };
    const learn = await DB.get('settings', 'voiceLearning');
    this.th = (learn && learn.learnedThreshold) ? learn.learnedThreshold : (prefs.voiceThreshold / 100);
    this.recordId = 'rec_' + Date.now();
    this.startedAt = Date.now();
    this.events = []; this.timeline = []; this.preRoll = []; this.activeChunks = null; this.silenceCount = 0;
    this.running = true;
    App.navigate('page-record');
    VAD.init().then(ok => {
      document.getElementById('rec-vad-state').textContent = ok ? 'VAD準備完了' : '帯域判定モード';
    });
    try { this.wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    window.addEventListener('devicemotion', this.onMotion);
    this.ctx = new AudioContext();
    const src = this.ctx.createMediaStreamSource(PrepMgr.stream);
    this.proc = this.ctx.createScriptProcessor(4096, 1, 1);
    this.proc.onaudioprocess = e => this.onAudio(e.inputBuffer.getChannelData(0));
    src.connect(this.proc); this.proc.connect(this.ctx.destination);
    this.timer = setInterval(() => this.updateClock(), 1000);
    this.tlTimer = setInterval(() => this.timeline.push({ t: Math.floor((Date.now() - this.startedAt) / 1000), db: this.lastDb || 0, motion: this.lastMotion }), 5000);
  },
  onMotion(e) {
    const a = e.accelerationIncludingGravity || e.acceleration;
    if (a) Recorder.lastMotion = Math.sqrt((a.x||0)**2 + (a.y||0)**2 + (a.z||0)**2);
  },
  onAudio(buf) {
    if (!this.running) return;
    const chunk = new Float32Array(buf);
    const db = AudioUtil.calcDb(chunk);
    this.lastDb = db;
    document.getElementById('rec-db').textContent = db.toFixed(1);
    document.getElementById('bar-db').style.width = Math.min(100, Math.max(0, db)) + '%';
    document.getElementById('rec-motion').textContent = this.lastMotion.toFixed(2);
    document.getElementById('bar-motion').style.width = Math.min(100, this.lastMotion * 10) + '%';

    const triggerDb = (this.ref ? this.ref.envDb : 40) + 10;
    if (!this.activeChunks) {
      this.preRoll.push(chunk);
      if (this.preRoll.length > 6) this.preRoll.shift();
      if (db >= triggerDb) {
        this.activeChunks = [...this.preRoll, chunk];
        this.silenceCount = 0;
        this.evStart = (Date.now() - this.startedAt) / 1000;
        this.evPeak = db;
      }
    } else {
      this.activeChunks.push(chunk);
      if (db > this.evPeak) this.evPeak = db;
      if (db < triggerDb) {
        this.silenceCount++;
        if (this.silenceCount >= 12) this.finalizeEvent();
      } else {
        this.silenceCount = 0;
      }
    }
  },
  async finalizeEvent() {
    const chunks = this.activeChunks;
    this.activeChunks = null;
    const sr = this.ctx.sampleRate;
    const len = chunks.reduce((a, b) => a + b.length, 0);
    const dur = len / sr;
    if (dur < 0.3) return;
    const merged = new Float32Array(len);
    let off = 0; chunks.forEach(c => { merged.set(c, off); off += c.length; });

    let label = 'snore', voiceProb = 0;
    if (this.ref && this.evPeak >= this.ref.voiceDb) {
      voiceProb = await AudioUtil.judgeVoice(merged, sr);
      if (voiceProb >= this.th) label = 'voice';
      else if (voiceProb >= 0.30) label = 'unknown';
    }
    document.getElementById('rec-last-prob').textContent = Math.round(voiceProb * 100);
    const id = 'ev_' + this.events.length + '_' + Date.now();
    const meta = { id, startSec: this.evStart, durationSec: dur, peakDb: this.evPeak, label, voiceProb };
    this.events.push(meta);
    document.getElementById('rec-ev-count').textContent = this.events.length;
    if (label !== 'voice') {
      const wav = AudioUtil.encodeWav(merged, sr);
      await DB.put('clips', { recordId: this.recordId, id, wav, meta });
    }
  },
  updateClock() {
    const s = Math.floor((Date.now() - this.startedAt) / 1000);
    const hh = String(Math.floor(s / 3600)).padStart(2, '0');
    const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    document.getElementById('rec-time').textContent = `${hh}:${mm}:${ss}`;
  },
  async stop() {
    this.running = false;
    clearInterval(this.timer); clearInterval(this.tlTimer);
    window.removeEventListener('devicemotion', this.onMotion);
    if (this.activeChunks) await this.finalizeEvent();
    if (this.proc) this.proc.disconnect();
    if (this.ctx) this.ctx.close();
    if (this.wakeLock) try { this.wakeLock.release(); } catch {}
    await this.retrySave();
  },
  async retrySave() {
    try {
      const patient = await DB.get('settings', 'patient');
      await DB.put('records', {
        id: this.recordId, startedAt: this.startedAt, endedAt: Date.now(),
        patient, reference: this.ref, timeline: this.timeline, events: this.events
      });
      DetailMgr.open(this.recordId);
    } catch {
      document.getElementById('btn-retry-save').style.display = 'block';
      alert('保存に失敗しました。再試行してください。');
    }
  }
};

// 黒画面モード
const BlackScreen = {
  timer: null,
  enter() {
    const el = document.getElementById('black-screen');
    el.classList.add('active');
    const start = () => { this.timer = setTimeout(() => el.classList.remove('active'), 1500); };
    const cancel = () => { clearTimeout(this.timer); };
    el.ontouchstart = start; el.onmousedown = start;
    el.ontouchend = cancel; el.ontouchmove = cancel; el.onmouseup = cancel;
  }
};

// カレンダー
const CalMgr = {
  year: new Date().getFullYear(), month: new Date().getMonth(), records: [],
  async init() { this.records = await DB.getAll('records'); },
  shiftMonth(d) {
    this.month += d;
    if (this.month < 0) { this.month = 11; this.year--; }
    if (this.month > 11) { this.month = 0; this.year++; }
    this.render();
  },
  async render() {
    this.records = await DB.getAll('records');
    document.getElementById('cal-title').textContent = `${this.year}年 ${this.month + 1}月`;
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = ['日','月','火','水','木','金','土'].map(d => `<div class="cal-head">${d}</div>`).join('');
    const first = new Date(this.year, this.month, 1).getDay();
    const days = new Date(this.year, this.month + 1, 0).getDate();
    for (let i = 0; i < first; i++) grid.innerHTML += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= days; d++) {
      const has = this.records.some(r => {
        const dt = new Date(r.startedAt);
        return dt.getFullYear() === this.year && dt.getMonth() === this.month && dt.getDate() === d;
      });
      grid.innerHTML += `<div class="cal-day ${has ? 'has-rec' : ''}" onclick="CalMgr.selectDay(${d})">${d}</div>`;
    }
  },
  selectDay(d) {
    const list = this.records.filter(r => {
      const dt = new Date(r.startedAt);
      return dt.getFullYear() === this.year && dt.getMonth() === this.month && dt.getDate() === d;
    });
    const box = document.getElementById('cal-list');
    if (!list.length) { box.textContent = '記録はありません'; return; }
    box.innerHTML = list.map(r => `
      <div class="ev-item">
        <div>
          <div><strong>${new Date(r.startedAt).toLocaleTimeString()}</strong></div>
          <div class="muted">イベント: ${r.events.length}件</div>
        </div>
        <button class="btn btn-sm btn-primary" onclick="DetailMgr.open('${r.id}')">詳細</button>
      </div>
    `).join('');
  }
};

// 詳細表示
const DetailMgr = {
  currentRecordId: null,
  async open(id) {
    this.currentRecordId = id;
    const rec = await DB.get('records', id);
    if (!rec) return;
    App.navigate('page-detail');
    const snore = rec.events.filter(e => e.label === 'snore').length;
    const voice = rec.events.filter(e => e.label === 'voice').length;
    const unk = rec.events.filter(e => e.label === 'unknown').length;
    document.getElementById('detail-meta').textContent =
      `${new Date(rec.startedAt).toLocaleString()} / いびき:${snore} 人声:${voice} 不明:${unk}`;
    this.draw(rec);
    const clips = await DB.getClipsByRecord(id);
    const clipMap = new Map(clips.map(c => [c.id, c.wav]));
    document.getElementById('detail-events').innerHTML = rec.events.slice(0, 100).map(e => `
      <div class="ev-item">
        <div>
          <span class="badge b-${e.label}">${e.label === 'snore' ? 'いびき' : e.label === 'voice' ? '人声(除外)' : '不明'}</span>
          <span class="muted">${e.startSec.toFixed(1)}s (${e.durationSec.toFixed(1)}s) / ${e.peakDb.toFixed(1)}dB / ${Math.round(e.voiceProb*100)}%</span>
        </div>
        ${e.label !== 'voice' && clipMap.has(e.id) ? `<button class="btn btn-sm" onclick="DetailMgr.playClip('${id}','${e.id}')">▶ 再生</button>` : ''}
      </div>
    `).join('');
  },
  async playClip(recId, evId) {
    const clip = await DB.get('clips', [recId, evId]);
    if (clip && clip.wav) new Audio(URL.createObjectURL(clip.wav)).play();
  },
  draw(rec) {
    const c = document.getElementById('detail-canvas');
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    if (!rec.timeline.length) return;
    ctx.strokeStyle = '#22c55e'; ctx.beginPath();
    rec.timeline.forEach((p, i) => {
      const x = (i / Math.max(1, rec.timeline.length - 1)) * c.width;
      const y = c.height - (Math.min(100, Math.max(0, p.db)) / 100) * c.height;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  },
  loadExternal(input) {
    if (input.files[0]) alert('外部ログを読み込みました: ' + input.files[0].name);
  }
};

// 共有・ZIP出力（15MB制限なし・全件出力）
const ShareMgr = {
  rec: null, unknowns: [], pageIdx: 0, perPage: 50,
  async open(id) {
    this.rec = await DB.get('records', id);
    this.unknowns = this.rec.events.filter(e => e.label === 'unknown');
    this.pageIdx = 0;
    App.navigate('page-share');
    this.render();
  },
  render() {
    const unconfirmed = this.unknowns.filter(e => !e.decision).length;
    document.getElementById('share-summary').textContent = `不明イベント: ${this.unknowns.length}件（未確認: ${unconfirmed}件）`;
    const slice = this.unknowns.slice(this.pageIdx * this.perPage, (this.pageIdx + 1) * this.perPage);
    document.getElementById('share-list').innerHTML = slice.map(e => `
      <div class="ev-item">
        <div>
          <span class="badge b-${e.decision || 'unknown'}">${e.decision || '未確認'}</span>
          <span class="muted">${e.startSec.toFixed(1)}s / ${e.peakDb.toFixed(1)}dB</span>
        </div>
        <div class="row">
          <button class="btn btn-sm" onclick="DetailMgr.playClip('${this.rec.id}','${e.id}')">▶</button>
          <button class="btn btn-sm btn-ok" onclick="ShareMgr.decide('${e.id}','snore')">OK</button>
          <button class="btn btn-sm btn-ng" onclick="ShareMgr.decide('${e.id}','voice')">ダメ</button>
        </div>
      </div>
    `).join('') || '<div class="muted">確認対象はありません</div>';
    document.getElementById('share-page-info').textContent = `${this.pageIdx + 1} / ${Math.max(1, Math.ceil(this.unknowns.length / this.perPage))}`;
  },
  page(d) {
    const max = Math.max(0, Math.ceil(this.unknowns.length / this.perPage) - 1);
    this.pageIdx = Math.min(max, Math.max(0, this.pageIdx + d));
    this.render();
  },
  async decide(evId, dec) {
    const ev = this.rec.events.find(e => e.id === evId);
    if (ev) ev.decision = dec;
    await DB.put('records', this.rec);
    await this.saveLearningFromDecisions();
    this.render();
  },
  async decideAll(dec) {
    this.unknowns.forEach(e => { e.decision = dec; });
    await DB.put('records', this.rec);
    await this.saveLearningFromDecisions();
    this.render();
  },
  async saveLearningFromDecisions() {
    const learn = (await DB.get('settings', 'voiceLearning')) || { snoreProbs: [], voiceProbs: [], learnedThreshold: null };
    this.unknowns.forEach(e => {
      if (e.decision === 'snore') learn.snoreProbs.push(e.voiceProb);
      if (e.decision === 'voice') learn.voiceProbs.push(e.voiceProb);
    });
    learn.snoreProbs = learn.snoreProbs.slice(-200);
    learn.voiceProbs = learn.voiceProbs.slice(-200);
    if (learn.snoreProbs.length && learn.voiceProbs.length) {
      const avgS = learn.snoreProbs.reduce((a, b) => a + b, 0) / learn.snoreProbs.length;
      const avgV = learn.voiceProbs.reduce((a, b) => a + b, 0) / learn.voiceProbs.length;
      learn.learnedThreshold = Math.min(0.95, Math.max(0.35, (avgS + avgV) / 2));
    }
    await DB.put('settings', learn, 'voiceLearning');
  },
  async exportZip() {
    if (this.unknowns.some(e => !e.decision)) {
      return alert('未確認の不明イベントが残っています。すべて確認してください。');
    }
    const btn = document.getElementById('btn-make-zip');
    btn.disabled = true; btn.textContent = 'ZIP作成中...';
    const validEvents = this.rec.events.filter(e => e.label === 'snore' || e.decision === 'snore');
    const clips = await DB.getClipsByRecord(this.rec.id);
    const clipMap = new Map(clips.map(c => [c.id, c.wav]));
    const files = [{ name: 'record.json', data: new TextEncoder().encode(JSON.stringify({ ...this.rec, events: validEvents })) }];
    for (const ev of validEvents) {
      const wav = clipMap.get(ev.id);
      if (wav) files.push({ name: `clips/${ev.id}.wav`, data: new Uint8Array(await wav.arrayBuffer()) });
    }
    const zipBlob = this.buildStoreZip(files);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob);
    a.download = `SomnoLog_${this.rec.id}.zip`;
    a.click();
    btn.disabled = false; btn.textContent = 'ZIPを作成する';
  },
  buildStoreZip(files) {
    const parts = [], central = [];
    let offset = 0;
    const crcTable = new Uint32Array(256).map((_, n) => {
      let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1); return c >>> 0;
    });
    const crc32 = buf => {
      let c = 0xffffffff; for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0;
    };
    for (const f of files) {
      const nameBuf = new TextEncoder().encode(f.name);
      const crc = crc32(f.data);
      const lh = new ArrayBuffer(30 + nameBuf.length);
      const lv = new DataView(lh);
      lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(8, 0, true);
      lv.setUint32(14, crc, true); lv.setUint32(18, f.data.length, true); lv.setUint32(22, f.data.length, true);
      lv.setUint16(26, nameBuf.length, true);
      new Uint8Array(lh, 30).set(nameBuf);
      parts.push(lh, f.data);

      const ch = new ArrayBuffer(46 + nameBuf.length);
      const cv = new DataView(ch);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, f.data.length, true); cv.setUint32(24, f.data.length, true);
      cv.setUint16(28, nameBuf.length, true); cv.setUint32(42, offset, true);
      new Uint8Array(ch, 46).set(nameBuf);
      central.push(ch);
      offset += lh.byteLength + f.data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
    const eocd = new ArrayBuffer(22);
    const ev = new DataView(eocd);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
    return new Blob([...parts, ...central, eocd], { type: 'application/zip' });
  },
  openMailer() {
    location.href = `mailto:?subject=SomnoLogデータ提出&body=作成したZIPファイルを添付して送信してください。`;
  }
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
